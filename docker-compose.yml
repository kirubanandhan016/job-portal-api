services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: job_portal
      POSTGRES_USER: job_portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - job-portal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_portal -d job_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://job_portal:${POSTGRES_PASSWORD}@db:5432/job_portal
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (at least 32 characters) in your environment}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  job-portal-postgres-data:
