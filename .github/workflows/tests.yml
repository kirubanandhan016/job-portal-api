name: Job Portal tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_portal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/job_portal_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/job_portal_test
      SECRET_KEY: ci-only-job-portal-signing-secret-never-use-outside-ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run security tests
        run: python -m pytest -v
      - name: Apply and verify Alembic migrations
        run: |
          alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              revision = connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              assert revision == "0001_initial", revision
              assert connection.execute(text("SELECT 1")).scalar_one() == 1
          tables = set(inspect(engine).get_table_names())
          assert {"users", "jobs", "applications"}.issubset(tables), tables
          print(f"PostgreSQL migration {revision}; tables: {sorted(tables)}")
          engine.dispose()
          PY

      - name: Build Docker image
        run: docker build --tag job-portal-api:ci .
